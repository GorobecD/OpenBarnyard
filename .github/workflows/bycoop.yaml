name: BYCoop

on:
  push:
    paths: [ "SDK/BYCoop/**", "SDK/BYModCore/**", "SDK/BYardSDK/**", ".github/workflows/bycoop.yaml" ]
  workflow_dispatch:

jobs:
  win:
    runs-on: windows-latest
    env:
      PREMAKE_VERSION: 5.0.0-beta8
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    - name: Network layer tests (no game needed)
      shell: cmd
      run: |
        cd SDK\BYCoop
        cl /nologo /std:c++17 /EHsc /W3 /Fe:test_session.exe Tests\test_session.cpp Source\Net\Session.cpp Source\Net\UdpTransport.cpp ws2_32.lib
        test_session.exe

    - name: Launcher
      shell: cmd
      run: |
        cd SDK\BYCoop\Launcher
        cl /nologo /O2 /W3 /MT /Fe:BYCoopLauncher.exe launcher.c user32.lib

    - uses: abel0b/setup-premake@v2.3
      with:
        version: ${{ env.PREMAKE_VERSION }}

    - name: Premake
      run: premake5 vs2026 --arch=x86 --renderer=DX8

    - uses: microsoft/setup-msbuild@v2

    - name: Build BYCoop (Release)
      shell: pwsh
      run: |
        msbuild ./OpenBarnyard.slnx "/t:SDK\BYModCore;SDK\BYCoop" /p:Configuration=Release /p:PlatformToolset=v143 /m /nologo /v:m /clp:ErrorsOnly | Tee-Object build.log
        $code = $LASTEXITCODE
        # surface errors as annotations (readable through the API)
        Get-Content build.log | Select-String -Pattern "error" | Select-Object -First 40 | ForEach-Object { Write-Output ("::error::" + ($_.Line -replace '^.*\\SDK\\','SDK\\')) }
        exit $code

    - name: Collect
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force out | Out-Null
        New-Item -ItemType Directory -Force out\Mods | Out-Null
        Get-ChildItem bin -Recurse -Include BYModCore.dll | Copy-Item -Destination out
        Get-ChildItem bin -Recurse -Include BYCoop.dll,BYCoop.pdb | Copy-Item -Destination out\Mods
        Copy-Item SDK\BYCoop\Launcher\BYCoopLauncher.exe out
        Get-ChildItem -Recurse out
        Get-ChildItem out

    - uses: actions/upload-artifact@v4
      with:
        name: BYCoop
        path: out
